[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retake"
version = "0.1.0"
description = "Solo talking recordings with the retakes handled for you: voice-following teleprompter, pronunciation coach, recorder and editor."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Sergio Alves Junior" }]
dependencies = [
  "PySide6>=6.8",
  "numpy>=1.26",
  "soundfile>=0.12",
  "sounddevice>=0.4.6",
  "soxr>=0.3",
  "vosk>=0.3.45",
  "rapidfuzz>=3.0",
  "psutil>=5.9",
  "tomli-w>=1.0",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
coach = ["torch>=2.2"]
whisper = ["faster-whisper>=1.0"]
whisper-cuda12 = ["faster-whisper>=1.0", "nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
nvidia = ["nvidia-ml-py>=12.0"]
pedal = ["evdev>=1.6"]
portal = ["jeepney>=0.8"]
dev = ["pytest>=8"]

[project.scripts]
retake = "retake.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retake = ["qml/*.qml", "languages/*.toml", "languages/cmudict.dict.gz", "languages/cmudict.LICENSE", "i18n/*.qm", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
